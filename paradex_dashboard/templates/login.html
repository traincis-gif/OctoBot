<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paradex - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:#12121a;border:1px solid #1e1e2e;border-radius:12px;padding:40px;width:360px}
h1{font-size:24px;margin-bottom:24px;text-align:center;color:#00d4aa}
input{width:100%;padding:12px;background:#1a1a2e;border:1px solid #2a2a3e;border-radius:8px;color:#fff;font-size:16px;margin-bottom:16px}
input:focus{outline:none;border-color:#00d4aa}
button{width:100%;padding:12px;background:#00d4aa;color:#0a0a0f;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
button:hover{background:#00e8bb}
.error{color:#ff4444;text-align:center;margin-bottom:12px;font-size:14px}
</style>
</head>
<body>
<div class="login-box">
<h1>Paradex Dashboard</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/login">
<input type="password" name="password" placeholder="Password" autofocus>
<button type="submit">Login</button>
</form>
</div>
</body>
</html>
